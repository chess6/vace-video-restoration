# Cloud production profile: Wan2.1-VACE-14B at native 720p.
#
# NOTHING here is downloaded or executed locally. The 14B model will not fit the
# RTX 3060 and, per project instruction, is not attempted on this machine.
#
# The point of this file is reuse: the SAME chunk manifest, reference sheets,
# prompts, masks and depth videos produced locally feed this profile unchanged.
# Only `video.width/height`, the model names and the sampler budget differ.
#
# Because the manifest stores source TIMES as well as frame indices, regenerating
# the manifest at 720p does not invalidate the masks/depth: rerun
#   scripts/preprocess_source.py --config configs/cloud_14b.yaml
#   scripts/make_depth.py        --config configs/cloud_14b.yaml
#   scripts/track_subject.py     --config configs/cloud_14b.yaml
# on the cloud box to re-render the control streams at the higher resolution from
# the same normalized source and the same tracked seeds.

profile: cloud_14b

model:
  diffusion_model: wan2.1_vace_14B_fp16.safetensors
  text_encoder:    umt5_xxl_fp8_e4m3fn_scaled.safetensors
  vae:             wan_2.1_vae.safetensors
  clip_type: wan
  weight_dtype: default

# Download these ON THE CLOUD MACHINE ONLY.
# Verified reachable at authoring time; re-check sizes/sha256 before trusting.
download:
  repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
  files:
    - split_files/diffusion_models/wan2.1_vace_14B_fp16.safetensors
    - split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
    - split_files/vae/wan_2.1_vae.safetensors
  note: >-
    UNVERIFIED, BENCHMARK BEFORE COMMITTING TO A RENTAL. Nothing in this profile
    has been run: the 14B weights are not downloaded here and do not fit this
    GPU. The fp16 14B diffusion checkpoint alone is ~34.7 GB before activations,
    the text encoder, the VAE and a 1280x720x81 latent, so a single 48 GB card is
    plausible but not demonstrated - and the official VACE example presents
    14B/720p on eight GPUs. Treat one-GPU fp16 as the thing to test first, with
    the fp8_scaled 14B variant and a smaller chunk_frames as the fallbacks.
    On a 24 GB card (4090/A10G) the fp8_scaled variant and chunk_frames 61 are
    the starting point. Measure with scripts/benchmark.py on the rented box
    before planning around any of these numbers.

video:
  model_fps: 16
  # Native 720p for Wan 2.1. Both multiples of 16.
  width: 1280
  height: 720
  fit_mode: pad
  pad_color: black
  chunk_frames: 81
  chunk_overlap: 16      # wider overlap is affordable here and blends better
  min_shot_frames: 17

scene_detect:
  threshold: 27.0
  min_scene_len_frames: 16

control:
  # Keep identical to local_1p3b.yaml so the cloud run differs from the validated
  # local pilot only in model capacity and resolution.
  profile: depth
  canny_low: 80
  canny_high: 160

sampling:
  seed: 20260803         # keep identical to the local pilot for comparability
  steps: 30
  cfg: 5.0
  sampler: uni_pc
  scheduler: simple
  denoise: 1.0
  vace_strength: 1.0

mask:
  feather: 10            # scaled up with resolution
  grow: 6
  polarity: white_is_regenerate

# Conditioning text. Intentionally identical to local_1p3b.yaml, so the only
# variable between the local pilot and cloud production is model capacity and
# resolution - and the overlay below reaches both profiles alike.
#
# A category-free default: it runs, and it says nothing about what is being
# restored. The wording actually used is overlaid at load time from the untracked
# configs/prompt.local.yaml - common.py::_apply_prompt_overlay says why a
# functional input is withheld anyway. Reproducing a recorded number needs the
# overlay that produced it; this default will not reproduce it.
prompt:
  positive: >-
    the same subject, identical appearance, identical attributes in the same colours,
    patterns, textures and accessories, consistent proportions and silhouette,
    natural surface texture and material detail, sharp accurate detail, following the
    original motion, lighting direction and camera perspective, matching the
    surrounding scene
  negative: >-
    a different subject, substituted appearance, altered attributes, changed colours,
    redesigned attributes, new background, altered scene, duplicated or malformed
    structure, warping, morphing, flickering, ghosting, blurry, low quality,
    jpeg artifacts, oversaturated, cartoon, anime, painting, illustration, text,
    watermark, caption, logo, border

# ---------------------------------------------------------------------------
# Stages added after this profile was first written. All UNVERIFIED at 720p:
# every number below is the local setting scaled by the resolution change and
# the extra VRAM, and none of it has been run. Benchmark on the rented box.
# ---------------------------------------------------------------------------

background:
  enabled: true
  # 48 GB makes the 7B model reachable, which the 12 GB card never was. Start on
  # 3B fp16 - it is the configuration whose OUTPUT has actually been inspected
  # locally, so it is the one whose failure modes are known. Move to 7B only
  # after a side-by-side on the rented box, not on the assumption that bigger is
  # better: more capacity also means more invented signage and distant anchors.
  model: seedvr2_3b_fp16.safetensors
  vae: seedvr2_ema_vae_fp16.safetensors
  weight_dtype: default          # no fp8 needed at 48 GB
  chunking_mode: manual
  # Wider temporal chunks are affordable here, and fewer seams is the main
  # quality gain available from the extra VRAM. Must stay 4n+1.
  frames_per_chunk: 41
  temporal_overlap: 2            # LATENT frames; clamped to (fpc-1)/4
  vae_tile_size: 1024
  vae_tile_overlap: 128
  target_short_edge: 720         # already native at this resolution
  profiles:
    background_conservative:
      steps: 12
      cfg: 1.0
      denoise: 0.75
      color_correction: lab
      description: >-
        Prioritises structural and temporal fidelity. Least likely to invent
        detail, alter signage or mutate distant anchors.
    background_aggressive:
      steps: 25
      cfg: 1.0
      denoise: 1.0
      color_correction: wavelet
      description: >-
        Reconstructs stronger plausible environmental detail. Expect more
        invented texture, and check signage and distant anchors before trusting it.

roi:
  # Off by default at 720p, and this is a real decision rather than an oversight.
  # The ROI pass exists to buy subject resolution the model would not otherwise
  # get. At 1280x720 with 14B the subject already receives far more pixels than
  # the local 720x544 pass could give it, so the crop mostly costs context and
  # adds a warp/unwarp round trip. Turn it on only if a measured pilot on the
  # rented box shows the subject still under-resolved.
  enabled: false
  target_height_fraction: 0.78
  target_height_fraction_max: 0.80
  height_percentile: 90
  containment_percentile: 95
  min_useful_scale: 1.15
  context_margin: 0.18
  max_subject_clip: 0.02
  max_crop_motion_px: 3.0

composite:
  path: composite
  # Scaled with resolution: these are pixel widths, and the frame is ~1.8x wider
  # than the local pass in each axis.
  band_px: 5
  center_band: true
  occluder_band_px: 4
  occluder_temporal_smooth: 0.35

pose:
  # Same alternative-to-depth relationship as locally: chosen by control.profile,
  # never blended with depth.
  enabled: true
  model: sdpose_wholebody_fp16.safetensors
  batch_size: 16                 # more VRAM to spend on throughput
  draw_body: true
  draw_hands: true
  draw_face: true
  draw_feet: true
  draw_head: true
  stick_width: 6                 # scaled with resolution
  anchor_point_size: 5
  score_threshold: 0.3

output:
  fps: 16
  chunk_codec: ffv1
  master_crf: 12
  master_preset: slow

runtime:
  comfy_host: 127.0.0.1
  comfy_port: 8188
  require_cuda: true
  # Suggested rented hardware, for reference only.
  suggested_gpu: "1x L40S 48GB or 1x A6000 48GB"
  estimated_vram_gb: 38
