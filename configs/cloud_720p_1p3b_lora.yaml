# The subject-LoRA experiment, as a difference from the 720p profile.
#
# `extends` exists so this file can BE the experiment: two fields, both of them
# the point. Copying the whole profile to change a LoRA name is how two configs
# that are meant to be identical stop being identical, and the pilot already
# lost time to a run that recorded one setting while using another.
extends: cloud_720p_1p3b.yaml

profile: cloud_720p_1p3b_lora

model:
  # Trained by scripts/train_subject_lora.sh on the 9 held-in reference crops,
  # 2520 steps. Scored 0.5167 median match against the 3 held-out references,
  # which the training never saw; the no-LoRA baseline scored 0.0226, and the
  # held-out references score 0.7454 against each other on the same measurement,
  # which is the ceiling. Provenance and the full curve: reports/lora_results.md.
  #
  # Trained against Wan2.1 T2V 1.3B, applied to VACE 1.3B. All 300 modules bind
  # (scripts/verify_lora_loads.py) because VACE is that backbone plus its own
  # blocks - which the LoRA does not touch.
  lora:
    name:            subject_1p3b_v2.safetensors
    strength:        1.0

prompt:
  # Prepend the trigger token, and it is not decoration: the captions in the
  # training set were that token and nothing else, so the LoRA does approximately
  # nothing unless the prompt says it. A run with the LoRA loaded and the token
  # missing looks exactly like a LoRA that did not work.
  #
  # The token itself is a name for the subject, so it lives in the untracked
  # overlay (configs/prompt.local.yaml, key `trigger`) and load_config refuses to
  # run this profile without it. What stays tracked is the part that is the
  # experiment's design rather than the subject: WHICH arm carries the token.
  # Both arms do - the control config differs from this file in the LoRA and
  # nothing else - so the token cannot explain a difference between them.
  #
  # The rest of the prompt is the base profile's, inherited unchanged: `extends`
  # means it is not restated here and so cannot drift from it.
  use_trigger: true
